name: Release apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Resolve release version
        id: version
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}' }
          $version = $version.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build desktop ZIP and Android APK
        run: .\scripts\build-release.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: effects-${{ steps.version.outputs.value }}
          path: artifacts/v${{ steps.version.outputs.value }}/Effects-*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/v${{ steps.version.outputs.value }}/Effects-*.zip
            artifacts/v${{ steps.version.outputs.value }}/Effects-*.apk

  pv:
    # every song rendered as a 1080p PV (MP4 + cover PNG) and attached to the same release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg, CJK fonts and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render PVs
        run: node tools/render_pv.js --out artifacts/pv

      - name: Save PVs
        uses: actions/upload-artifact@v4
        with:
          name: effects-pv
          path: artifacts/pv/*
          if-no-files-found: error

      - name: Attach PVs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          files: |
            artifacts/pv/*.mp4
            artifacts/pv/*.jpg
