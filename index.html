<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120c22">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>鋒兄宇宙 · 第一版本 · 二次元 PV</title>
<style>
  :root{
    --ink:#2a1d3a; --paper:#fffafc; --pink:#ff5f95; --blue:#38c6ff; --gold:#ffc23a;
    --glass:rgba(255,255,255,.86); --line:rgba(42,29,58,.16);
    --ui:"Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei UI","PingFang TC",system-ui,sans-serif;
    --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
    --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;background:#120c22;overflow:hidden;color:var(--ink);font-family:var(--ui);
    user-select:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #pv{position:fixed;inset:0;margin:auto;width:100%;height:100%;object-fit:contain;display:block;cursor:pointer;
    touch-action:manipulation}
  html.idle,html.idle #pv{cursor:none}
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    border-style:solid;border-color:transparent;border-width:var(--sat) var(--sar) var(--sab) var(--sal)}

  /* the transport, a white capsule bar that fades away while it plays */
  #bar{position:fixed;left:50%;bottom:max(14px,var(--sab));transform:translateX(-50%);
    width:min(960px,calc(100% - 24px - var(--sal) - var(--sar)));padding:10px 14px 12px;border-radius:22px;
    background:var(--glass);border:3px solid var(--ink);box-shadow:6px 7px 0 rgba(42,29,58,.35);z-index:20;
    transition:opacity .35s}
  html.idle #bar,
  html:has(#start:not(.gone)) #bar{opacity:0;pointer-events:none}
  #scrub{position:relative;height:18px;cursor:pointer;touch-action:none}
  #track{position:absolute;left:0;right:0;top:6px;height:6px;border-radius:3px;background:rgba(42,29,58,.14)}
  #played{position:absolute;left:0;top:6px;height:6px;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--pink),var(--gold),var(--blue))}
  #row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  #head{display:contents}
  #transport,#tools{display:flex;align-items:center;gap:8px;min-width:0}
  #transport{order:1}
  #time{order:2}
  #tools{order:3}
  .b{appearance:none;display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);
    background:#fff;color:var(--ink);font-family:var(--ui);font-size:13px;font-weight:800;letter-spacing:.06em;
    border-radius:999px;padding:6px 13px;cursor:pointer;text-decoration:none;white-space:nowrap;
    transition:transform .12s,background .12s;touch-action:manipulation}
  .b:active{transform:translateY(1px)}
  .b:focus-visible,.card:focus-visible,.ver a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #play{width:44px;height:44px;padding:0;font-size:16px;background:var(--pink);color:#fff}
  .nav{width:34px;height:34px;padding:0;font-size:12px}
  #time{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px}
  .ico{display:none}
  #now{order:4;margin-left:auto;display:flex;gap:10px;align-items:baseline;overflow:hidden;white-space:nowrap;
    max-width:40%;min-width:0}
  #ttl{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  #cast{font-size:12px;opacity:.65;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}

  /* the song list: cards on a pastel desktop */
  #start{position:fixed;inset:0;z-index:40;overflow:auto;transition:opacity .4s,visibility .4s;
    background:radial-gradient(circle at 20% 15%,#ffffff 0,#fff4fa 35%,#e7f6ff 100%)}
  #start::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,95,149,.35) 2px,transparent 2.5px);background-size:40px 40px}
  #start.gone{opacity:0;visibility:hidden;pointer-events:none}
  #start .in{position:relative;max-width:1000px;margin:0 auto;text-align:center;
    padding:calc(clamp(26px,6vh,64px) + var(--sat)) calc(18px + var(--sar)) calc(48px + var(--sab)) calc(18px + var(--sal))}
  #start .kick{font-size:12px;font-weight:800;letter-spacing:.5em;opacity:.55}
  #start h2{margin-top:10px;font-size:clamp(38px,8vw,76px);font-weight:900;line-height:1.1;letter-spacing:.04em;
    color:#fff;-webkit-text-stroke:0;paint-order:stroke fill;
    text-shadow:0 0 0 #fff,4px 5px 0 var(--ink)}
  #start h2 span{display:inline-block;-webkit-text-stroke:10px #fff;paint-order:stroke fill}
  #start h2 span:nth-child(5n+1){color:var(--pink)} #start h2 span:nth-child(5n+2){color:var(--blue)}
  #start h2 span:nth-child(5n+3){color:var(--gold)} #start h2 span:nth-child(5n+4){color:#8f6bff}
  #start h2 span:nth-child(5n+5){color:#3ddc97}
  #start .pill{display:inline-block;margin-top:16px;padding:8px 22px;border:3px solid var(--ink);border-radius:999px;
    background:#fff;font-weight:800;font-size:14px;letter-spacing:.12em;box-shadow:4px 5px 0 rgba(42,29,58,.3)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:34px;text-align:left}
  .card{display:flex;flex-direction:column;gap:6px;padding:0 0 14px;cursor:pointer;border:3px solid var(--ink);
    border-radius:18px;background:#fff;color:var(--ink);font-family:var(--ui);overflow:hidden;
    box-shadow:6px 7px 0 rgba(42,29,58,.28);transition:transform .15s}
  .card .n{display:block;padding:8px 14px;font-size:12px;font-weight:900;letter-spacing:.18em;color:#fff;
    border-bottom:3px solid var(--ink);background:var(--pink)}
  .card:nth-child(4n+2) .n{background:var(--blue)} .card:nth-child(4n+3) .n{background:var(--gold);color:var(--ink)}
  .card:nth-child(4n+4) .n{background:#8f6bff}
  .card .n::before{content:"🐾 "}
  .card .t{padding:0 14px;font-size:17px;font-weight:900;line-height:1.35}
  .card .c{padding:0 14px;font-size:12px;font-weight:600;opacity:.65}
  .card.cur{outline:4px solid var(--gold);outline-offset:2px}
  /* the version switch: 第一版本 (this page) / 第二版本 (pixel.html) */
  .ver{display:inline-flex;margin-bottom:22px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;
    background:#fff;box-shadow:4px 5px 0 rgba(42,29,58,.3);font-weight:900;font-size:14px;letter-spacing:.06em}
  .ver>*{padding:9px 20px;color:var(--ink);text-decoration:none}
  .ver .on{background:var(--pink);color:#fff}
  #start .keys{margin-top:30px;font-size:12px;font-weight:600;line-height:2;opacity:.6}
  #start .keys a{color:inherit}
  .touch{display:none;margin-top:16px;font-size:13px;font-weight:700;line-height:1.7;opacity:.62}

  /* tools/render_pv.js: just the frame */
  html.render #bar,html.render #start,#safe{display:none}
  html.render #pv{cursor:default}

  @media (hover:hover){
    .b:hover{background:#fff1f7;transform:translateY(-1px)}
    .card:hover{transform:translateY(-3px) rotate(-.5deg)}
    .ver a:hover{background:#fff1f7}
  }
  @media (pointer:coarse){
    .b{min-width:44px;min-height:44px;padding:0 12px;font-size:14px}
    .nav{width:44px;height:44px;font-size:16px}
    #play{width:52px;height:48px;font-size:18px}
    #scrub{height:28px}
    #track,#played{top:11px}
    .card{min-height:72px}
    .ver>*{min-height:44px;padding:12px 16px}
  }
  @media (max-width:820px){
    #bar{padding:8px 10px 10px;border-radius:18px}
    #row{gap:6px 8px;margin-top:4px}
    #head{display:flex;align-items:baseline;gap:8px;width:100%;min-width:0;order:0}
    #transport,#tools,#time,#now{order:0}
    #now{margin:0;max-width:none;flex:1 1 auto;font-size:14px}
    #time{flex:0 0 auto;min-width:0;font-size:12px;text-align:right}
    #transport{gap:6px}
    #tools{gap:6px;margin-left:auto}
    .wide{display:none}
    .ico{display:inline}
    #start .kick{letter-spacing:.18em}
    #start h2{letter-spacing:.02em}
    #start h2 span{-webkit-text-stroke-width:6px}
    #start .pill{letter-spacing:.04em;font-size:13px;padding:8px 14px}
    #grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:10px;margin-top:20px}
    .card .t{font-size:16px}
    .ver{flex-direction:column;align-items:stretch;width:min(100%,320px);border-radius:18px;letter-spacing:.02em}
    .ver>*{display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:12px 16px}
    .keys{display:none}
    .touch{display:block}
  }
  @media (max-width:359px){
    #bar{padding:6px 8px 8px}
    #row,#transport,#tools{gap:4px}
    .b{min-width:38px;min-height:40px;padding:0 8px;font-size:13px}
    .nav{width:38px;height:40px}
    #play{width:44px;height:42px;font-size:16px}
  }
  @media (max-height:500px){
    #bar{padding:6px 8px 8px;border-radius:16px}
    #scrub{height:16px}
    #track,#played{top:5px}
    #row{flex-wrap:nowrap;gap:6px;margin-top:2px}
    #head{display:contents}
    #transport{order:1;gap:6px}
    #time{order:2;min-width:64px;font-size:12px}
    #tools{order:3;gap:6px;margin-left:0}
    #now{order:4;flex:1 1 auto;width:auto;margin:0 0 0 4px;max-width:none;font-size:12px}
    #cast{display:none}
    .wide{display:none}
    .ico{display:inline}
    .b{min-width:36px;min-height:36px;padding:0 8px;font-size:12px}
    .nav{width:36px;height:36px;font-size:13px}
    #play{width:42px;height:36px;font-size:15px}
    #start .in{padding-top:calc(12px + var(--sat));padding-bottom:calc(16px + var(--sab))}
    #start h2{font-size:28px}
    .ver{flex-direction:row;width:auto;border-radius:999px}
    #grid{margin-top:12px}
    .keys{display:none}
    .touch{display:block;margin-top:8px}
  }
</style>
</head>
<body>
<canvas id="pv" width="1920" height="1080"></canvas>
<div id="safe"></div>

<div id="bar">
  <div id="scrub" role="slider" aria-label="播放進度" tabindex="0"><div id="track"></div><div id="played"></div></div>
  <div id="row">
    <div id="head">
      <div id="now"><span id="ttl">—</span><span id="cast"></span></div>
      <div id="time">0:00 / 0:00</div>
    </div>
    <div id="transport">
      <button class="b nav" id="bPrev" title="上一首" aria-label="上一首">⏮</button>
      <button class="b" id="play" title="播放／暫停" aria-label="播放">▶</button>
      <button class="b nav" id="bNext" title="下一首" aria-label="下一首">⏭</button>
    </div>
    <div id="tools">
      <button class="b" id="bList" title="選歌" aria-label="歌曲"><span class="wide">歌曲</span><span class="ico">曲</span></button>
      <a class="b" id="bPixel" href="pixel.html" title="第二版本：像素 MV" aria-label="第二版本"><span class="wide">第二版本</span><span class="ico">像素</span></a>
      <button class="b" id="bFull" title="全螢幕" aria-label="全螢幕"><span class="wide">全螢幕</span><span class="ico">全</span></button>
    </div>
  </div>
</div>

<div id="start">
  <div class="in">
    <nav class="ver" aria-label="版本">
      <span class="on">第一版本 · 二次元 PV</span><a href="pixel.html">第二版本 · 像素 MV</a>
    </nav>
    <div class="kick">鋒 兄 宇 宙 · P V</div>
    <h2><span>選</span><span>一</span><span>首</span><span>歌</span></h2>
    <div class="pill">九首歌 · 九支二次元風 PV</div>
    <div id="grid"></div>
    <div class="keys">
      空白 播放／暫停　·　← → 倒退／快進 5 秒　·　S 選歌　·　N P 換歌　·　0–9 跳段　·　F 全螢幕<br>
      第二版本是原本的像素 MV：<a href="pixel.html">切換到第二版本</a>
    </div>
    <div class="touch">點一首就開始。播放中輕點畫面，可以藏起或叫出按鈕。</div>
  </div>
</div>

<script src="data/songs.js?v=2.0.0"></script>
<script src="data/cast.js?v=2.1.0"></script>
<script src="js/puppet.js?v=2.3.0"></script>
<script src="js/story.js?v=2.3.0"></script>
<script src="js/pv.js?v=2.1.0"></script>
</body>
</html>
