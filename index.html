<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鋒兄宇宙 · PV</title>
<style>
  :root{
    --ink:#2a1d3a; --paper:#fffafc; --pink:#ff5f95; --blue:#38c6ff; --gold:#ffc23a;
    --glass:rgba(255,255,255,.86); --line:rgba(42,29,58,.16);
    --ui:"Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei UI","PingFang TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#120c22;overflow:hidden;color:var(--ink);font-family:var(--ui);
    user-select:none;-webkit-font-smoothing:antialiased}
  #pv{position:fixed;inset:0;margin:auto;width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
  html.idle,html.idle #pv{cursor:none}

  /* the transport, a white capsule bar that fades away while it plays */
  #bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(960px,calc(100% - 24px));padding:10px 14px 12px;border-radius:22px;background:var(--glass);
    border:3px solid var(--ink);box-shadow:6px 7px 0 rgba(42,29,58,.35);z-index:20;transition:opacity .35s}
  html.idle #bar{opacity:0;pointer-events:none}
  #scrub{position:relative;height:18px;cursor:pointer;touch-action:none}
  #track{position:absolute;left:0;right:0;top:6px;height:6px;border-radius:3px;background:rgba(42,29,58,.14)}
  #played{position:absolute;left:0;top:6px;height:6px;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--pink),var(--gold),var(--blue))}
  #row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .b{appearance:none;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-family:var(--ui);
    font-size:13px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:6px 13px;cursor:pointer;
    text-decoration:none;white-space:nowrap;transition:transform .12s,background .12s}
  .b:hover{background:#fff1f7;transform:translateY(-1px)}
  #play{width:44px;height:44px;padding:0;font-size:16px;background:var(--pink);color:#fff}
  .nav{width:34px;height:34px;padding:0;font-size:12px}
  #time{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px}
  #now{margin-left:auto;display:flex;gap:10px;align-items:baseline;overflow:hidden;white-space:nowrap;max-width:40%}
  #ttl{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  #cast{font-size:12px;opacity:.65}

  /* the song list: cards on a pastel desktop */
  #start{position:fixed;inset:0;z-index:40;overflow:auto;transition:opacity .4s,visibility .4s;
    background:radial-gradient(circle at 20% 15%,#ffffff 0,#fff4fa 35%,#e7f6ff 100%)}
  #start::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,95,149,.35) 2px,transparent 2.5px);background-size:40px 40px}
  #start.gone{opacity:0;visibility:hidden}
  #start .in{position:relative;max-width:1000px;margin:0 auto;padding:clamp(26px,6vh,64px) 18px 60px;text-align:center}
  #start .kick{font-size:12px;font-weight:800;letter-spacing:.5em;opacity:.55}
  #start h2{margin-top:10px;font-size:clamp(38px,8vw,76px);font-weight:900;line-height:1.1;letter-spacing:.04em;
    color:#fff;-webkit-text-stroke:0;paint-order:stroke fill;
    text-shadow:0 0 0 #fff,4px 5px 0 var(--ink)}
  #start h2 span{display:inline-block;-webkit-text-stroke:10px #fff;paint-order:stroke fill}
  #start h2 span:nth-child(5n+1){color:var(--pink)} #start h2 span:nth-child(5n+2){color:var(--blue)}
  #start h2 span:nth-child(5n+3){color:var(--gold)} #start h2 span:nth-child(5n+4){color:#8f6bff}
  #start h2 span:nth-child(5n+5){color:#3ddc97}
  #start .pill{display:inline-block;margin-top:16px;padding:8px 22px;border:3px solid var(--ink);border-radius:999px;
    background:#fff;font-weight:800;font-size:14px;letter-spacing:.12em;box-shadow:4px 5px 0 rgba(42,29,58,.3)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:34px;text-align:left}
  .card{display:flex;flex-direction:column;gap:6px;padding:0 0 14px;cursor:pointer;border:3px solid var(--ink);
    border-radius:18px;background:#fff;color:var(--ink);font-family:var(--ui);overflow:hidden;
    box-shadow:6px 7px 0 rgba(42,29,58,.28);transition:transform .15s}
  .card:hover{transform:translateY(-3px) rotate(-.5deg)}
  .card .n{display:block;padding:8px 14px;font-size:12px;font-weight:900;letter-spacing:.18em;color:#fff;
    border-bottom:3px solid var(--ink);background:var(--pink)}
  .card:nth-child(4n+2) .n{background:var(--blue)} .card:nth-child(4n+3) .n{background:var(--gold);color:var(--ink)}
  .card:nth-child(4n+4) .n{background:#8f6bff}
  .card .n::before{content:"🐾 "}
  .card .t{padding:0 14px;font-size:17px;font-weight:900;line-height:1.35}
  .card .c{padding:0 14px;font-size:12px;font-weight:600;opacity:.65}
  .card.cur{outline:4px solid var(--gold);outline-offset:2px}
  #start .keys{margin-top:30px;font-size:12px;font-weight:600;line-height:2;opacity:.6}
  #start .keys a{color:inherit}

  /* tools/render_pv.js: just the frame */
  html.render #bar,html.render #start{display:none}
  html.render #pv{cursor:default}

  @media (max-width:560px){
    #bar{padding:8px 10px 10px;border-radius:18px} .b{font-size:11px;padding:5px 10px}
    #play{width:38px;height:38px} .nav{width:30px;height:30px} #time{font-size:11px;min-width:80px}
    #now{display:none} #start .keys{display:none}
  }
</style>
</head>
<body>
<canvas id="pv" width="1920" height="1080"></canvas>

<div id="bar">
  <div id="scrub" role="slider" aria-label="播放進度" tabindex="0"><div id="track"></div><div id="played"></div></div>
  <div id="row">
    <button class="b nav" id="bPrev" title="上一首 P">⏮</button>
    <button class="b" id="play" title="播放／暫停 空白">▶</button>
    <button class="b nav" id="bNext" title="下一首 N">⏭</button>
    <div id="time">0:00 / 0:00</div>
    <button class="b" id="bList" title="選歌 S">歌曲</button>
    <a class="b" id="bPixel" href="pixel.html" title="原本的像素 MV">像素版</a>
    <button class="b" id="bFull" title="全螢幕 F">全螢幕</button>
    <div id="now"><span id="ttl">—</span><span id="cast"></span></div>
  </div>
</div>

<div id="start">
  <div class="in">
    <div class="kick">鋒 兄 宇 宙 · P V</div>
    <h2><span>選</span><span>一</span><span>首</span><span>歌</span></h2>
    <div class="pill">九首歌 · 九支二次元風 PV</div>
    <div id="grid"></div>
    <div class="keys">
      空白 播放／暫停　·　← → 倒退／快進 5 秒　·　S 選歌　·　N P 換歌　·　0–9 跳段　·　F 全螢幕<br>
      想看原本的像素 MV：<a href="pixel.html">像素版</a>
    </div>
  </div>
</div>

<script src="data/songs.js?v=2.0.0"></script>
<script src="data/cast.js?v=2.1.0"></script>
<script src="js/puppet.js?v=2.3.0"></script>
<script src="js/story.js?v=2.3.0"></script>
<script src="js/pv.js?v=2.0.0"></script>
</body>
</html>
