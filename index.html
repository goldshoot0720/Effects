<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鋒兄宇宙 · 3D MV</title>
<style>
  :root{
    --ink:#f4f7ff; --dim:rgba(244,247,255,.55); --dim2:rgba(244,247,255,.3);
    --gold:#ffd24a; --hot:#ff3b6b; --cy:#35e8ff;
    --glass:rgba(12,14,30,.55); --line:rgba(255,255,255,.12);
    --ui: "Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04050c;overflow:hidden;font-family:var(--ui);color:var(--ink);
    -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- top bar ---------- */
  #top{position:fixed;top:0;left:0;right:0;padding:18px 24px;display:flex;align-items:flex-start;
    gap:14px;pointer-events:none;z-index:20;transition:opacity .45s}
  #top .mark{font-size:11px;letter-spacing:.42em;color:var(--dim);padding-top:6px;line-height:1.5}
  #top h1{font-size:19px;font-weight:900;letter-spacing:.06em;
    text-shadow:0 0 24px rgba(255,210,74,.45)}
  #top .cast{font-size:11px;letter-spacing:.3em;color:var(--dim);margin-top:5px}
  .chip{margin-left:auto;pointer-events:auto;display:flex;gap:8px;align-items:center}
  .tag{font-size:10px;letter-spacing:.24em;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;background:var(--glass);backdrop-filter:blur(12px);
    white-space:nowrap}
  #fps{font-variant-numeric:tabular-nums;min-width:66px;text-align:center}

  /* ---------- bottom transport ---------- */
  #bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 20px 18px;
    background:linear-gradient(to top,rgba(4,5,12,.86),rgba(4,5,12,0));transition:opacity .45s}
  #scrub{position:relative;height:46px;cursor:pointer}
  #wave{position:absolute;inset:0;width:100%;height:100%}
  #scrub .head{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);
    box-shadow:0 0 14px var(--gold);pointer-events:none;transform:translateX(-1px)}
  #scrub .hover{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);
    opacity:0;pointer-events:none}
  #scrub:hover .hover{opacity:1}
  #marks{position:absolute;inset:0;pointer-events:none}
  #marks i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.14)}
  #marks b{position:absolute;bottom:2px;font-size:9px;letter-spacing:.2em;color:var(--dim2);
    font-weight:400;transform:translateX(4px)}
  #row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  button.b{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);
    font-family:var(--ui);font-size:11px;letter-spacing:.18em;border-radius:999px;padding:9px 13px;
    cursor:pointer;backdrop-filter:blur(12px);transition:.18s;white-space:nowrap}
  button.b:hover{border-color:rgba(255,210,74,.6);color:var(--gold);transform:translateY(-1px)}
  button.b.on{border-color:rgba(255,210,74,.8);color:var(--gold);background:rgba(255,210,74,.12)}
  #play{width:52px;height:52px;border-radius:50%;padding:0;font-size:17px;flex:0 0 auto;
    border-color:rgba(255,210,74,.55);color:var(--gold);background:rgba(255,210,74,.1)}
  .nav{width:38px;height:38px;border-radius:50%;padding:0;font-size:12px;flex:0 0 auto}
  #time{font-size:12px;letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums;min-width:112px}
  #now{margin-left:auto;font-size:12px;letter-spacing:.2em;color:var(--dim);
    max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}

  /* ---------- lyric panel ---------- */
  #panel{position:fixed;top:0;right:0;bottom:0;width:330px;z-index:18;padding:88px 22px 120px;
    overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 82%,transparent);
    mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 82%,transparent);
    transition:opacity .4s,transform .4s}
  #panel.hide{opacity:0;transform:translateX(24px);pointer-events:none}
  #panel .l{font-size:13px;line-height:1.65;color:rgba(244,247,255,.3);padding:5px 0;cursor:pointer;
    transition:.25s;letter-spacing:.04em}
  #panel .l:hover{color:rgba(244,247,255,.75)}
  #panel .l.cur{color:var(--gold);font-size:15px;font-weight:800;text-shadow:0 0 18px rgba(255,210,74,.5)}
  #panel .l.done{color:rgba(244,247,255,.16)}
  #panel .sec{font-size:9px;letter-spacing:.34em;color:var(--dim2);margin:16px 0 6px}
  #scrollwrap{transition:transform .45s cubic-bezier(.2,.8,.2,1)}

  /* ---------- song picker / start ---------- */
  #start{position:fixed;inset:0;z-index:40;overflow:auto;
    background:radial-gradient(120% 90% at 50% 30%,rgba(24,12,44,.72),rgba(3,4,10,.97));
    backdrop-filter:blur(6px);transition:opacity .55s,visibility .55s}
  #start.gone{opacity:0;visibility:hidden}
  #start .in{max-width:1080px;margin:0 auto;padding:clamp(28px,6vh,72px) 28px 60px;text-align:center}
  #start .kicker{font-size:10px;letter-spacing:.6em;color:var(--dim);margin-bottom:18px}
  #start h2{font-size:clamp(32px,6vw,62px);font-weight:900;letter-spacing:.04em;line-height:1.05;
    background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,#ff8a3b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 40px rgba(255,180,60,.35))}
  #start .sub{margin-top:12px;font-size:12px;letter-spacing:.3em;color:var(--dim)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:34px}
  .card{position:relative;text-align:left;padding:18px 18px 16px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);background:rgba(12,14,30,.5);transition:.2s;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,210,74,.55);
    background:rgba(28,22,48,.6);box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .card .n{font-size:10px;letter-spacing:.3em;color:var(--dim2)}
  .card .t{font-size:16px;font-weight:900;margin:8px 0 6px;line-height:1.35}
  .card .c{font-size:11px;letter-spacing:.14em;color:var(--dim)}
  .card .m{margin-top:12px;font-size:10px;letter-spacing:.18em;color:var(--dim2);
    display:flex;gap:10px;flex-wrap:wrap}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.7}
  .card.cur{border-color:rgba(255,210,74,.75);background:rgba(44,30,20,.6)}
  #start .keys{margin-top:34px;font-size:10.5px;letter-spacing:.14em;color:var(--dim2);line-height:2.1}
  kbd{border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-family:var(--ui);
    font-size:10px;color:var(--dim);margin:0 2px}

  /* ---------- sync editor ---------- */
  #editor{position:fixed;left:20px;bottom:104px;z-index:30;width:360px;padding:16px 18px;
    border:1px solid rgba(255,210,74,.35);border-radius:14px;background:rgba(10,8,20,.88);
    backdrop-filter:blur(18px);display:none}
  #editor.on{display:block}
  #editor h3{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:12px}
  #editor .cur{font-size:16px;font-weight:800;margin:6px 0 4px;min-height:24px}
  #editor .nx{font-size:12px;color:var(--dim);min-height:18px}
  #editor .hint{margin-top:14px;font-size:10.5px;line-height:2;color:var(--dim2)}
  #editor .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);z-index:50;
    padding:11px 22px;border-radius:999px;background:rgba(10,8,20,.9);border:1px solid var(--line);
    font-size:12px;letter-spacing:.18em;opacity:0;transition:.3s;pointer-events:none;
    backdrop-filter:blur(14px);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  body.idle #top,body.idle #bottom,body.idle #panel{opacity:0}
  body.idle{cursor:none}
  @media (max-width:820px){ #panel{display:none} #now{display:none} #editor{width:auto;right:20px} }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="top">
  <div class="mark">3D<br>MV</div>
  <div>
    <h1 id="ttl">—</h1>
    <div class="cast" id="cast"></div>
  </div>
  <div class="chip">
    <div class="tag" id="fps">-- FPS</div>
    <div class="tag" id="actTag">—</div>
  </div>
</div>

<div id="panel"><div id="scrollwrap"></div></div>

<div id="bottom">
  <div id="scrub">
    <canvas id="wave"></canvas>
    <div id="marks"></div>
    <div class="hover" id="hov"></div>
    <div class="head" id="head"></div>
  </div>
  <div id="row">
    <button class="b nav" id="bPrev">◀</button>
    <button class="b" id="play">▶</button>
    <button class="b nav" id="bNext">▶</button>
    <div id="time">0:00 / 0:00</div>
    <button class="b" id="bList">歌曲 S</button>
    <button class="b" id="bLyr">字幕 L</button>
    <button class="b" id="bEdit">校時 E</button>
    <button class="b" id="bQual">畫質 Q · 高</button>
    <button class="b" id="bFull">全螢幕 F</button>
    <div id="now"></div>
  </div>
</div>

<div id="editor">
  <h3>歌詞校時 LYRIC SYNC</h3>
  <div class="cur" id="eCur">—</div>
  <div class="nx" id="eNx">—</div>
  <div class="hint">
    <kbd>空白</kbd> 唱到下一句的瞬間敲一下（記錄時間並跳下一句）<br>
    <kbd>←</kbd><kbd>→</kbd> 微調目前這句 ±0.1s　<kbd>Z</kbd> 退回上一句<br>
    <kbd>[</kbd><kbd>]</kbd> 整首歌詞位移 ±0.1s（自動記在瀏覽器）
  </div>
  <div class="btns">
    <button class="b" id="eLrc">匯出 .lrc</button>
    <button class="b" id="eRst">還原</button>
  </div>
</div>

<div id="toast"></div>

<div id="start">
  <div class="in">
    <div class="kicker">鋒 兄 宇 宙 · 3 D 音 樂 視 覺</div>
    <h2>選一首歌</h2>
    <div class="sub">CANVAS 3D MOTION GRAPHICS · 音樂視覺同步</div>
    <div id="grid"></div>
    <div class="keys">
      <kbd>空白</kbd> 播放/暫停　<kbd>←</kbd><kbd>→</kbd> 快轉 5 秒　<kbd>S</kbd> 選歌　<kbd>L</kbd> 字幕　<kbd>F</kbd> 全螢幕　<kbd>Q</kbd> 畫質<br>
      <kbd>E</kbd> 歌詞校時（可自己敲準時間軸後匯出 .lrc）　拖曳 .lrc 進畫面即可套用
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<script src="data/songs.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
