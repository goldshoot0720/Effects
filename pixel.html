<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>鋒兄宇宙 · 第二版本 · 像素 MV</title>
<style>
  :root{
    --ink:#f4f7ff; --dim:rgba(244,247,255,.55); --dim2:rgba(244,247,255,.28);
    --gold:#ffd24a; --line:rgba(255,255,255,.14); --glass:rgba(10,8,18,.66);
    --ui:"Microsoft JhengHei UI","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
    --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;background:#05040a;overflow:hidden;color:var(--ink);
    font-family:var(--ui);user-select:none;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  #screen{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;
    touch-action:manipulation}
  /* measured in JS so the pixel HUD clears the notch and the home indicator */
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    border-style:solid;border-color:transparent;border-width:var(--sat) var(--sar) var(--sab) var(--sal)}

  #top{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;gap:12px;
    align-items:flex-start;pointer-events:none;z-index:20;transition:opacity .4s}
  #top h1{font-size:15px;font-weight:900;letter-spacing:.05em;
    text-shadow:0 2px 0 #000,0 0 18px rgba(255,210,74,.4)}
  #top .cast{font-size:10px;letter-spacing:.24em;color:var(--dim);margin-top:4px;
    text-shadow:0 1px 0 #000}

  #bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:0 calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));
    background:linear-gradient(to top,rgba(5,4,10,.92),rgba(5,4,10,0));transition:opacity .35s}
  body.chrome-off #bottom,
  body:has(#start:not(.gone)) #bottom{opacity:0;pointer-events:none}
  #scrub{position:relative;height:16px;cursor:pointer;touch-action:none}
  #track{position:absolute;left:0;right:0;top:6px;height:4px;background:rgba(255,255,255,.15)}
  #played{position:absolute;left:0;top:6px;height:4px;width:0;background:var(--gold);
    box-shadow:0 0 10px rgba(255,210,74,.7)}
  #row{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
  #head{display:contents}
  #transport,#tools{display:flex;align-items:center;gap:7px;min-width:0}
  #transport{order:1}
  #time{order:2}
  #tools{order:3}
  button.b,a.b{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);
    font-family:var(--ui);font-size:10px;letter-spacing:.14em;border-radius:4px;padding:7px 10px;
    cursor:pointer;transition:.15s;white-space:nowrap;touch-action:manipulation}
  a.b{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  button.b:active,a.b:active{border-color:rgba(255,210,74,.85);color:var(--gold)}
  button.b:focus-visible,a.b:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #play{width:40px;height:40px;border-radius:4px;padding:0;font-size:15px;
    border-color:rgba(255,210,74,.6);color:var(--gold);background:rgba(255,210,74,.12)}
  .nav{width:30px;height:30px;padding:0;font-size:11px}
  #time{font-size:10px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums;
    min-width:74px}
  .k{opacity:.6}
  .ico{display:none}
  #now{order:4;margin-left:auto;display:flex;gap:10px;align-items:baseline;font-size:10px;
    letter-spacing:.14em;color:var(--dim);overflow:hidden;white-space:nowrap;max-width:44vw;min-width:0}
  #now #ttl{font-weight:900;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
    flex:0 1 auto;min-width:0;max-width:72%}
  #now #cast{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}

  #start{position:fixed;inset:0;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;
    background:radial-gradient(120% 90% at 50% 25%,rgba(30,14,44,.9),rgba(3,2,8,.98));
    transition:opacity .45s,visibility .45s}
  #start.gone{opacity:0;visibility:hidden;pointer-events:none}
  #start .in{max-width:900px;margin:0 auto;text-align:center;
    padding:calc(clamp(24px,6vh,60px) + var(--sat)) calc(20px + var(--sar)) calc(50px + var(--sab)) calc(20px + var(--sal))}
  #start .kick{font-size:9px;letter-spacing:.6em;color:var(--dim2);margin-bottom:14px}
  #start h2{font-size:clamp(26px,6vw,48px);font-weight:900;letter-spacing:.06em;color:var(--gold);
    text-shadow:0 3px 0 #000,0 0 30px rgba(255,180,60,.4)}
  #start .sub{margin-top:10px;font-size:11px;letter-spacing:.22em;color:var(--dim)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-top:26px}
  .card{display:flex;flex-direction:column;gap:5px;text-align:left;padding:12px;cursor:pointer;
    border:1px solid var(--line);background:rgba(12,10,22,.7);color:var(--ink);
    font-family:var(--ui);border-radius:4px;transition:.15s;touch-action:manipulation}
  .card:active{border-color:var(--gold);background:rgba(34,24,48,.8)}
  .card.cur{border-color:var(--gold);background:rgba(50,34,14,.8)}
  .card .n{font-size:9px;letter-spacing:.3em;color:var(--dim2)}
  .card .t{font-size:14px;font-weight:900;line-height:1.3}
  .card .c{font-size:10px;letter-spacing:.1em;color:var(--dim)}
  #start .ver{display:inline-flex;margin-bottom:20px;border:1px solid rgba(255,210,74,.6);border-radius:4px;overflow:hidden;
    font-size:12px;font-weight:900;letter-spacing:.14em;max-width:100%}
  #start .ver>*{padding:8px 16px;color:var(--ink);text-decoration:none;background:rgba(12,10,22,.7)}
  #start .ver .on{background:var(--gold);color:#140b0c}
  #start .keys{margin-top:26px;font-size:10px;letter-spacing:.1em;color:var(--dim2);line-height:2}
  .touch{display:none;margin-top:18px;font-size:12px;letter-spacing:.06em;color:var(--dim2);line-height:1.8}

  @media (hover:hover){
    button.b:hover,a.b:hover{border-color:rgba(255,210,74,.6);color:var(--gold)}
    .card:hover{border-color:rgba(255,210,74,.6);background:rgba(34,24,48,.8)}
    #start .ver a:hover{color:var(--gold)}
  }
  @media (pointer:coarse){
    button.b,a.b{min-width:44px;min-height:44px;padding:0 10px;font-size:13px;letter-spacing:.04em}
    #start .ver>*{padding:12px 14px;min-height:44px}
    .nav{width:44px;height:44px;font-size:16px}
    #play{width:52px;height:48px;font-size:18px}
    #scrub{height:28px}
    #track,#played{top:12px}
    .card{min-height:64px;padding:14px}
  }
  @media (max-width:820px){
    #bottom{padding:0 calc(10px + var(--sar)) calc(8px + var(--sab)) calc(10px + var(--sal))}
    #row{flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:2px}
    #head{display:flex;align-items:baseline;gap:8px;width:100%;min-width:0;order:0}
    #transport,#time,#tools,#now{order:0}
    #now{margin:0;max-width:none;flex:1 1 auto;font-size:13px;letter-spacing:.04em}
    #time{flex:0 0 auto;min-width:0;font-size:12px;letter-spacing:.04em;text-align:right}
    #transport{gap:6px}
    #tools{gap:6px;margin-left:auto}
    .wide{display:none}
    .ico{display:inline}
    #bPv{display:none}
    #start .ver{flex-wrap:wrap;justify-content:center;letter-spacing:.04em;font-size:13px}
    #start .kick{letter-spacing:.22em;font-size:clamp(8px,2.6vw,11px)}
    #start h2{letter-spacing:.04em}
    #start .sub{letter-spacing:.08em;font-size:12px;line-height:1.6}
    #grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:8px;margin-top:18px}
    .card .t{font-size:16px}
    .card .c{font-size:12px;letter-spacing:.04em}
    .keys{display:none}
    .touch{display:block}
  }
  @media (max-width:359px){
    #bottom{padding-left:calc(6px + var(--sal));padding-right:calc(6px + var(--sar))}
    button.b,a.b{min-width:38px;min-height:40px;padding:0 4px;font-size:12px}
    .nav{width:38px;height:40px}
    #play{width:44px;height:42px;font-size:16px}
    #transport,#tools{gap:4px}
  }
  @media (max-height:500px){
    #bottom{padding-bottom:calc(6px + var(--sab))}
    #scrub{height:16px}
    #track,#played{top:6px}
    #row{flex-wrap:nowrap;flex-direction:row;gap:6px;margin-top:2px}
    #head{display:contents}
    #transport{order:1;gap:6px}
    #time{order:2;font-size:11px;min-width:64px;letter-spacing:.06em}
    #tools{order:3;gap:6px;margin-left:0}
    #now{order:4;flex:1 1 auto;width:auto;margin:0 0 0 4px;max-width:none;font-size:11px;letter-spacing:.04em}
    #cast{display:none}
    .wide{display:none}
    .ico{display:inline}
    button.b,a.b{min-width:36px;min-height:36px;padding:0 6px;font-size:12px}
    .nav{width:36px;height:36px;font-size:13px}
    #play{width:42px;height:36px;font-size:15px}
    #start .in{padding-top:calc(12px + var(--sat));padding-bottom:calc(14px + var(--sab))}
    #start .kick{margin-bottom:6px;letter-spacing:.18em}
    #start h2{font-size:22px}
    #start .sub{margin-top:4px}
    #grid{margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
    .card{min-height:0;padding:8px 10px}
    .keys{display:none}
    .touch{display:block;margin-top:10px}
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="safe"></div>

<div id="bottom">
  <div id="scrub" role="slider" aria-label="播放進度" tabindex="0">
    <div id="track"></div><div id="played"></div>
  </div>
  <div id="row">
    <div id="head">
      <div id="now"><span id="ttl">—</span><span id="cast"></span></div>
      <div id="time">0:00 / 0:00</div>
    </div>
    <div id="transport">
      <button class="b nav" id="bPrev" title="上一首" aria-label="上一首">⏮</button>
      <button class="b" id="play" aria-label="播放">▶</button>
      <button class="b nav" id="bNext" title="下一首" aria-label="下一首">⏭</button>
    </div>
    <div id="tools">
      <button class="b" id="bList" aria-label="歌曲"><span class="wide">歌曲 <span class="k">S</span></span><span class="ico">曲</span></button>
      <button class="b" id="bQual" aria-label="像素粗細"><span class="wide">像素 <span class="k">Q ·</span> </span><span id="qName">中</span></button>
      <button class="b" id="bCel" title="角色：T-pose 立繪人偶／手繪賽璐璐" aria-label="角色畫法"><span class="wide">角色 <span class="k">C ·</span> </span><span id="celName">立繪</span></button>
      <button class="b" id="bFull" aria-label="全螢幕"><span class="wide">全螢幕 <span class="k">F</span></span><span class="ico">全</span></button>
      <a class="b" id="bPv" href="index.html" title="第一版本：二次元 PV"><span class="wide">第一版本</span><span class="ico">PV</span></a>
    </div>
  </div>
</div>

<div id="start">
  <div class="in">
    <nav class="ver" aria-label="版本">
      <a href="index.html">第一版本 · 二次元 PV</a><span class="on">第二版本 · 像素 MV</span>
    </nav>
    <div class="kick">鋒 兄 宇 宙 · P I X E L　M V</div>
    <h2>選一首歌</h2>
    <div class="sub">90 年代 PC-98 賽璐璐風 · 每首歌一組故事分鏡</div>
    <div id="grid"></div>
    <div class="keys">
      空白 播放／暫停　·　← → 倒退／快進 10 秒　·　S 選歌　·　N P 換歌　·　Q 像素粗細　·　C 立繪／手繪　·　L 角色表　·　F 全螢幕
    </div>
    <div class="touch">點一首就開始。播放中輕點畫面，可以藏起或叫出按鈕。</div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>
<script src="data/songs.js?v=2.0.0"></script>
<script src="data/cast.js?v=2.1.0"></script>
<script src="js/puppet.js?v=2.1.0"></script>
<script src="js/story.js?v=2.1.0"></script>
<script src="js/px.js?v=2.2.0"></script>
</body>
</html>
